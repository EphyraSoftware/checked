[package]
name = "checked_cli"
version = "0.1.3"
edition = "2024"

[[bin]]
name = "checked"

[dependencies]
holochain_client = { version = "=0.8.1-rc.8", default-features = false }
holochain_conductor_api = { version = "0.6.1-rc.8", features = ["sqlite-encrypted"] }
holochain_types = "0.6.1-rc.8"
checked_types = { path = "../types/checked_types" }
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive", "cargo"] }
minisign = "0.9.1"
reqwest = "0.13.2"
tempfile = "3.27.0"
tokio = "1.52.1"
url = "2.5.8"
indicatif = "0.18.4"
dialoguer = "0.12.0"
ed25519-dalek = "2.2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.149"
rand = "0.10.1"
itertools = "0.14.0"
proc-ctl = { version = "0.4.1" }

[target.'cfg(any(windows, unix))'.dependencies]
dirs = "6.0"
rpassword = "7.4.0"

[dev-dependencies]
holochain = { version = "0.6.1-rc.8", default-features = false, features = ["sweettest", "wasmer_sys", "sqlite-encrypted"] }
signing_keys_types = { path = "../types/signing_keys" }
warp = "0.4.2"

[lints.rust]
let_underscore_drop = "forbid"
unsafe_code = "forbid"

missing_docs = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"

# Cannot use this currently since it doesn't understand the library+binary pattern.
# unused_crate_dependencies = "deny"

absolute_paths_not_starting_with_crate = "warn"
keyword_idents = { level = "warn", priority = -1 }
missing_copy_implementations = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"
unused_qualifications = "warn"

# At the time of adding, these took the binary size from 23MB to 8.3Mb. Still big but better.
[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
