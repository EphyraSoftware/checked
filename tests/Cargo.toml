[package]
name = "checked_integration_tests"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
holochain = { version = "0.6.1-rc.8", default-features = false, features = ["sweettest", "wasmer_sys", "sqlite-encrypted", "transport-tx5-backend-go-pion"] }
holochain_types = "0.6.1-rc.8"
holochain_conductor_api = { version = "0.6.1-rc.8", features = ["sqlite-encrypted"] }
checked_types = { path = "../types/checked_types" }
signing_keys_types = { path = "../types/signing_keys" }
anyhow = "1.0.102"
tokio = { version = "1.52.1", features = ["macros", "rt-multi-thread"] }
serde = { version = "1", features = ["derive"] }
chrono = { version = "0.4.44", default-features = false, features = ["clock", "std"] }

# Workaround for upstream Holochain 0.6.1-rc.8 dev-dep chain:
# iroh-relay 0.95.1 -> {iroh-base, pkarr} -> ed25519-dalek =3.0.0-pre.1 -> curve25519-dalek =5.0.0-pre.1,
# which references digest::crypto_common. That alias was removed at digest 0.11.0-rc.11+,
# so cargo's natural pick of digest 0.11.2 fails to compile. Force the iroh side of the
# tree onto a sha1/sha2/digest combo that still exposes digest::crypto_common.
sha1 = "=0.11.0-rc.4"
sha2 = "=0.11.0-rc.4"
digest = "=0.11.0-rc.10"
